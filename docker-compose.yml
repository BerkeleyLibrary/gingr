---
services:
  app:
    build: .
    depends_on:
      solr:
        condition: service_healthy
      spatial:
        condition: service_started
      geoserver:
        condition: service_healthy
      geoserver-secure:
        condition: service_healthy
    command:
      - tail
      - -f
      - /dev/null
    environment:
      CI: "${CI:-false}" # set to 'true' to mimic GitHub Actions
      GEOSERVER_ROOT: data/geoserver/
      GEOSERVER_SECURE_URL: http://admin:geoserver@geoserver-secure:8080/geoserver/rest/
      GEOSERVER_URL: http://admin:geoserver@geoserver:8080/geoserver/rest/
      SOLR_URL: http://solr:8983/solr/geodata-test
      SPATIAL_ROOT: data/spatial/
      SPATIAL_URL: http://spatial
    restart: no
    volumes:
      - ./:/opt/app:delegated

  solr:
    command: >
      bash -c 'echo geodata geodata-test | xargs -n1 precreate-core && solr-foreground'
    image: solr:8.11.2
    ports:
      - 8983:8983
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - ./solr:/opt/solr/server/solr/configsets:ro

  spatial:
    image: httpd:2.4
    ports:
      - 80:80
    volumes:
      - ./data/spatial:/usr/local/apache2/htdocs/:ro

  geoserver:
    image: ghcr.io/berkeleylibrary/geoserver:latest
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - ./data/geoserver/public:/srv/geofiles:delegated

  geoserver-secure:
    image: ghcr.io/berkeleylibrary/geoserver:latest
    ports:
      - 8081:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - ./data/geoserver/UCB:/srv/geofiles:delegated
